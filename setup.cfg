# Packaging Information
# =====================

[metadata]
name = tf-sheriff
author = PDS
author_email = pds_operator@jpl.nasa.gov
description = Keeps the peace in PDS/PDC terraform/ directories — validates Terraform against the org's Must-Have/Should-Have Development Guidelines
long_description = file: README.md
long_description_content_type = text/markdown
version = file: src/pds/tf_sheriff/VERSION.txt
license = apache-2.0
keywords = pds, planetary data, terraform, infrastructure as code, validator, guidelines, iac
url = https://github.com/NASA-PDS/tf-sheriff
download_url = https://github.com/NASA-PDS/tf-sheriff/releases/
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.13
    Environment :: Console
    Topic :: Software Development :: Quality Assurance
    Operating System :: OS Independent


# Options
# -------

[options]
# No third-party runtime dependencies — the validator is intentionally
# stdlib-only so scripts/validate_terraform.py can also be vendored
# standalone into another repo's CI without a package install.
#install_requires =

zip_safe = True
include_package_data = True
package_dir =
    = src
packages = find_namespace:
python_requires = >= 3.13


[options.extras_require]
dev =
    flake8~=7.3.0
    flake8-bugbear~=24.12.12
    flake8-docstrings~=1.7.0
    pep8-naming~=0.13.3
    mypy~=1.14.1
    pydocstyle~=6.3.0
    coverage~=7.3.0
    pytest~=7.4.0
    pytest-cov~=4.1.0
    pytest-watch~=4.2.0
    pytest-xdist~=3.3.1
    pre-commit~=4.6.1
    detect-secrets~=1.5.0
    tox~=4.11.0
    types-setuptools~=68.1.0.0


[options.entry_points]
console_scripts =
    tf-sheriff = pds.tf_sheriff.main:main


[options.packages.find]
where = src


# Coverage Testing
# ----------------
[coverage:run]
omit = */_version.py,*/__init__.py


# Pytest
# ------
[tool:pytest]
addopts = --numprocesses auto --cov=pds --cov-report=xml --cov-report=term


# Flake8
# ------
[flake8]
max-line-length = 120
extend-exclude = versioneer.py,_version.py,docs,tests,setup.py
docstring_convention = google
extend-ignore = E203, E501, W503
select = D,E,F,N,W,B,B902,B903,B950


# mypy
# ----
[mypy]

[mypy-pds.*._version]
ignore_errors = True
